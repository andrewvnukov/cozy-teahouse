<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Уютная Чайная</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<script>
  window.__inIframe = true;
  try{ window.__inIframe = window.top !== window.self; }catch(e){ window.__inIframe = true; }
  if(!window.__inIframe){ window.__noSDK = true; }
  else {
    var __sdkS = document.createElement('script');
    __sdkS.src = 'https://yandex.ru/games/sdk/v2';
    __sdkS.onerror = function(){ window.__noSDK = true; if(window.__onSdkScriptDone) window.__onSdkScriptDone(); };
    __sdkS.onload  = function(){ if(window.__onSdkScriptDone) window.__onSdkScriptDone(); };
    document.head.appendChild(__sdkS);
  }
</script>
<script src="sfx.js"></script>
<style>
  :root{
    /* ── Токены под тему «лесная чайная в сумерках» ── */
    --ink:#4A3324; --ink-soft:#9C8268; --line:#5C3F2A;
    --paper:#FFF6E4;
    --accent:#D98C3D; --accent-deep:#B96F27;
    --gold:#E8B84B; --mint:#8FBF7A; --lav:#B9A3E3; --dusk:#6E5A9C;
    --bg:#3B2A1E;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);position:fixed;inset:0;background:var(--bg)}
  #cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
  #hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;
       padding:calc(10px + env(safe-area-inset-top)) 12px calc(12px + env(safe-area-inset-bottom));
       max-width:560px;margin:0 auto}
  .top{display:flex;gap:8px;align-items:flex-start}
  .chip{background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:6px 12px 6px 8px;
        display:flex;gap:8px;align-items:center;box-shadow:0 3px 0 rgba(74,51,36,.28)}
  .chip .ic{width:26px;height:26px;flex:none}
  .chip .tx{display:flex;flex-direction:column;gap:1px}
  .chip .v{font-weight:900;font-size:17px;line-height:1}
  .chip .l{font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:.3px}
  .spacer{flex:1}
  #side{position:absolute;right:max(12px,calc(50% - 268px));top:118px;display:flex;flex-direction:column;gap:12px;pointer-events:auto}
  .rbtn{width:52px;height:52px;border-radius:50%;background:var(--paper);border:2.5px solid var(--line);
        box-shadow:0 3px 0 rgba(74,51,36,.28);display:flex;align-items:center;justify-content:center;
        cursor:pointer;transition:transform .08s,box-shadow .08s;padding:0}
  .rbtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,51,36,.28)}
  .rbtn svg{width:27px;height:27px;display:block}
  .rbtn .langTxt{font-weight:900;font-size:13px;color:var(--ink);letter-spacing:.2px}
  .bottom{display:flex;gap:10px;pointer-events:auto}
  .abtn{flex:1;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:10px 8px;
        font-weight:900;font-size:15px;cursor:pointer;box-shadow:0 3px 0 rgba(74,51,36,.28);
        transition:transform .08s,box-shadow .08s;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff}
  .abtn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,51,36,.28)}
  .abtn .bt{font-size:15px;line-height:1.05}
  .abtn .bs{font-size:11px;font-weight:800;opacity:.92;display:flex;align-items:center;gap:3px}
  .abtn .bs svg{width:12px;height:12px}
  .abtn.blue{background:var(--dusk);border-color:#4E3F72}
  .abtn.lav{background:var(--lav);border-color:#8E76C0}
  .abtn.off{filter:grayscale(.55) brightness(.92)}
  /* ── модалка (гости/апгрейды/гостевая книга) ── */
  #modal{position:absolute;inset:0;background:rgba(30,20,14,.55);display:flex;align-items:flex-end;
         justify-content:center;pointer-events:auto;z-index:5;transition:opacity .2s}
  #modal.hidden{opacity:0;pointer-events:none}
  .sheet{position:relative;background:linear-gradient(180deg,#FFFDF5,#FBF0DA);width:100%;max-width:560px;
         border:3px solid var(--line);border-bottom:none;border-radius:24px 24px 0 0;
         padding:16px 14px calc(16px + env(safe-area-inset-bottom));max-height:85%;
         display:flex;flex-direction:column;box-shadow:0 -6px 24px rgba(30,20,14,.3)}
  #mScroll{overflow-y:auto;overflow-x:hidden}
  #mTitle{font-weight:900;font-size:20px;text-align:center;margin:2px 44px 12px;color:var(--ink)}
  #mClose{position:absolute;top:10px;right:12px;width:38px;height:38px;border-radius:50%;z-index:2;
          background:var(--paper);border:2.5px solid var(--line);font-size:21px;font-weight:900;
          color:var(--ink);cursor:pointer;box-shadow:0 3px 0 rgba(74,51,36,.28)}
  #mClose:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(74,51,36,.28)}
  .row{display:flex;align-items:center;gap:10px;background:#FFF8E6;border:2.5px solid var(--line);
       border-radius:16px;padding:9px 10px;margin-bottom:9px;box-shadow:0 2px 0 rgba(74,51,36,.18)}
  .row .thumb{width:52px;height:44px;flex:none;background:#F1E3C6;border:2px solid var(--line);border-radius:11px}
  .row .info{flex:1;min-width:0}
  .row .nm{font-weight:900;font-size:15px;line-height:1.1}
  .row .ds{font-size:11.5px;font-weight:800;color:var(--ink-soft);margin-top:1px}
  .buy{border:2.5px solid var(--accent-deep);background:var(--accent);color:#fff;font-weight:900;
       font-size:13px;padding:8px 12px;border-radius:12px;cursor:pointer;white-space:nowrap;
       box-shadow:0 2px 0 rgba(74,51,36,.25);flex:none}
  .buy:active{transform:translateY(1px)}
  .buy.can-not{background:#CFC7B4;border-color:#B3AB98;color:#7C7462}
  .buy.owned{background:var(--mint);border-color:#5FA045}
  .coll{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
  .card{background:#FFF8E6;border:2.5px solid var(--line);border-radius:14px;padding:8px 4px 6px;
        text-align:center;box-shadow:0 2px 0 rgba(74,51,36,.18)}
  .card canvas{width:78px;height:56px;display:block;margin:0 auto}
  .card .cn{font-weight:900;font-size:12px;margin-top:3px}
  .card.locked{opacity:.72}
  .card .qm{font-weight:900;font-size:30px;color:var(--ink-soft);height:56px;line-height:56px}
  #toast{position:absolute;left:50%;bottom:104px;transform:translateX(-50%) translateY(20px);
         background:var(--ink);color:#fff;font-weight:800;font-size:14px;padding:9px 16px;border-radius:99px;
         opacity:0;transition:.25s;pointer-events:none;z-index:8;text-align:center}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body oncontextmenu="return false">
<canvas id="cv"></canvas>
<div id="hud">
  <div class="top">
    <div class="chip">
      <svg class="ic" viewBox="0 0 26 26"><path d="M12 4c6 .5 9 5 8 11-6 1-11-2-12-8-.6-2 .3-3.4 4-3z" fill="#8FBF7A" stroke="#4A3324" stroke-width="2" stroke-linejoin="round"/><path d="M8 18c2-4.5 6-7.5 11-8.5" fill="none" stroke="#4A3324" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span class="tx"><span class="v" id="coinsV">0</span><span class="l" id="coinsL">ЧАИНКИ</span></span>
    </div>
    <div class="chip">
      <svg class="ic" viewBox="0 0 26 26"><path d="M5 12h13v3.5a5.5 5.5 0 01-11 0V12z" fill="#D98C3D" stroke="#4A3324" stroke-width="2" stroke-linejoin="round"/><path d="M18 12.5h1.6a2.6 2.6 0 010 5.2H18" fill="none" stroke="#4A3324" stroke-width="2"/><path d="M9 3.5c1 1.6-1 1.8 0 3.4M13.4 3.5c1 1.6-1 1.8 0 3.4" stroke="#4A3324" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>
      <span class="tx"><span class="v" id="ipsV">0/с</span><span class="l" id="ipsL">ДОХОД</span></span>
    </div>
    <div class="spacer"></div>
  </div>
  <div class="spacer"></div>
  <div class="bottom">
    <button class="abtn blue" id="giftBtn"><span class="bt" id="giftT">Подарок</span><span class="bs"><svg viewBox="0 0 12 12"><path d="M2 4h8v6H2z" fill="none" stroke="#fff" stroke-width="1.4"/><path d="M6 2v8M2 4l4 0 4 0" stroke="#fff" stroke-width="1.4"/></svg><span id="giftS">+50</span></span></button>
    <button class="abtn lav" id="x2Btn"><span class="bt" id="x2T">Доход ×2</span><span class="bs"><svg viewBox="0 0 12 12"><path d="M3 2l7 4-7 4z" fill="#fff"/></svg><span id="x2S">5 мин</span></span></button>
  </div>
</div>
<div id="side">
  <button class="rbtn" id="guestBtn" aria-label="Пригласить гостя">
    <svg viewBox="0 0 27 27"><path d="M13.5 5.5a2.4 2.4 0 012.4 2.4c3.4 1.2 4.6 4.6 4.6 8.1v3.2l2.2 2.3H4.3l2.2-2.3v-3.2c0-3.5 1.2-6.9 4.6-8.1a2.4 2.4 0 012.4-2.4z" fill="#E8B84B" stroke="#4A3324" stroke-width="2.1" stroke-linejoin="round"/><circle cx="13.5" cy="23" r="1.7" fill="#E8B84B" stroke="#4A3324" stroke-width="1.6"/></svg>
  </button>
  <button class="rbtn" id="upBtn" aria-label="Улучшения">
    <svg viewBox="0 0 27 27"><path d="M13.5 4l2.3 4.9 5.2.6-3.9 3.6 1.1 5.2-4.7-2.7-4.7 2.7 1.1-5.2L6 9.5l5.2-.6z" fill="#F2C14E" stroke="#4A3324" stroke-width="2.1" stroke-linejoin="round"/></svg>
  </button>
  <button class="rbtn" id="collBtn" aria-label="Гостевая книга">
    <svg viewBox="0 0 27 27"><rect x="4.5" y="4.5" width="8" height="8" rx="2" fill="#8FBF7A" stroke="#4A3324" stroke-width="2.1"/><rect x="14.5" y="4.5" width="8" height="8" rx="2" fill="#B9A3E3" stroke="#4A3324" stroke-width="2.1"/><rect x="4.5" y="14.5" width="8" height="8" rx="2" fill="#D98C3D" stroke="#4A3324" stroke-width="2.1"/><rect x="14.5" y="14.5" width="8" height="8" rx="2" fill="#E8B84B" stroke="#4A3324" stroke-width="2.1"/></svg>
  </button>
  <button class="rbtn" id="langBtn" aria-label="Язык"><span class="langTxt" id="langTxt">RU</span></button>
</div>
<div id="modal" class="hidden"><div class="sheet"><button id="mClose">×</button><div id="mTitle"></div><div id="mScroll"><div id="mBody"></div></div></div></div>
<div id="toast"></div>
<script>
'use strict';
// ============================================================
//  Уютная Чайная / Cozy Teahouse — idle-коллекционер про лесную чайную
//  Петля: налить чай (тап-доход) -> накопить чаинки -> пригласить нового
//  гостя (сидит в чайной, даёт пассивный доход) -> апгрейды. Живой лесной
//  вечер за окном.
// ============================================================
const SAVE_KEY = "cozy_teahouse_v1";        // GAME: уникальный ключ сейва
const LB_NAME  = "guests";                   // техимя лидерборда (рекорд = число гостей)
let ysdk=null, player=null, lb=null, saveT=0, booted=false;

// ---------- i18n (авто-язык через SDK + ручной переключатель) ----------
function lang(){
  try{ if(S && (S.lang==="ru"||S.lang==="en")) return S.lang; }catch(e){}
  try{ if(ysdk&&ysdk.environment&&ysdk.environment.i18n&&ysdk.environment.i18n.lang)
    return ysdk.environment.i18n.lang==="ru"?"ru":"en"; }catch(e){}
  return (navigator.language||"ru").slice(0,2)==="ru"?"ru":"en";
}
function toggleLang(){
  S.lang = lang()==="ru" ? "en" : "ru";
  document.documentElement.setAttribute("lang", S.lang);
  refreshHud(); persist(true); sfx("tap");
}
const STR = {
  coins:{ru:"ЧАИНКИ",en:"TEA LEAVES"}, income:{ru:"ДОХОД",en:"INCOME"},
  gift:{ru:"Подарок",en:"Gift"},
  x2:{ru:"Доход ×2",en:"Income ×2"}, x2on:{ru:"×2 идёт",en:"×2 active"},
  need:{ru:"Не хватает чаинок",en:"Not enough tea leaves"},
  guestTitle:{ru:"Пригласить гостя",en:"Invite a guest"},
  upTitle:{ru:"Улучшения чайной",en:"Teahouse upgrades"},
  collTitle:{ru:"Гостевая книга",en:"Guestbook"},
  buy:{ru:"Пригласить",en:"Invite"}, owned:{ru:"В гостях",en:"Visiting"},
  lvl:{ru:"Ур.",en:"Lv."},
  upTea:{ru:"Ароматный чай",en:"Aromatic tea"}, upTeaD:{ru:"+1 чаинка за подачу",en:"+1 leaf per serve"},
  upHearth:{ru:"Тёплый очаг",en:"Warm hearth"}, upHearthD:{ru:"+25% к пассивному доходу",en:"+25% passive income"},
  upBlanket:{ru:"Уютные пледы",en:"Cozy blankets"}, upBlanketD:{ru:"−5% к цене приглашения",en:"−5% invite price"},
  ipsUnit:{ru:"лист/с",en:"lf/s"},
  daily:{ru:"Ежедневный подарок:",en:"Daily gift:"},
  x2got:{ru:"Доход удвоен на 5 минут!",en:"Income doubled for 5 min!"},
  giftGot:{ru:"Подарок:",en:"Gift:"},
  newGuest:{ru:"Новый гость:",en:"New guest:"},
  allGuests:{ru:"Все гости в сборе!",en:"All guests gathered!"},
  hintPour:{ru:"Тапни по чайнику, чтобы налить чай",en:"Tap the teapot to pour tea"},
};
const T = k => (STR[k]||{})[lang()] || (STR[k]||{}).ru || k;
const nm = sp => lang()==="ru"? sp.ru : sp.en;

// ---------- Гости (0-й — стартовый, уже в чайной) ----------
const GUESTS = [
  {id:'fox',     ru:'Рыжик',     en:'Rusty',   c1:'#E8703A', c2:'#FFF6E4', shape:'fox',     ips:1,    cost:0},
  {id:'rabbit',  ru:'Пушок',     en:'Fluffy',  c1:'#E9E4D8', c2:'#F2B8C6', shape:'rabbit',  ips:3,    cost:30},
  {id:'hedgehog',ru:'Колючик',   en:'Spike',   c1:'#8A6B4A', c2:'#F0DCC0', shape:'hedgehog',ips:9,    cost:150},
  {id:'mouse',   ru:'Крошка',    en:'Tiny',    c1:'#B7A88E', c2:'#F5EDE1', shape:'mouse',   ips:24,   cost:560},
  {id:'deer',    ru:'Олешек',    en:'Dasher',  c1:'#C98A52', c2:'#F2E2C4', shape:'deer',    ips:60,   cost:1800},
  {id:'raccoon', ru:'Енотик',    en:'Bandit',  c1:'#6E6E6E', c2:'#2E2E2E', shape:'raccoon', ips:140,  cost:5200},
  {id:'badger',  ru:'Полосатик', en:'Stripes', c1:'#3A3A3A', c2:'#F5F5F0', shape:'badger',  ips:320,  cost:15000},
  {id:'owl',     ru:'Совуня',    en:'Hoot',    c1:'#7C6B54', c2:'#D9C9A3', shape:'owl',     ips:720,  cost:44000},
  {id:'bear',    ru:'Мишутка',   en:'Bruno',   c1:'#8C5A34', c2:'#D9B48F', shape:'bear',    ips:1600, cost:120000},
];
const GU = id => GUESTS.find(s=>s.id===id);

// ---------- Состояние ----------
function fresh(){ return {
  v:1, coins:0,
  guests:['fox'], seen:['fox'],             // приглашённые гости / обнаруженные для книги
  tea:0, hearth:0, blanket:0,                // уровни апгрейдов
  best:1,                                    // рекорд числа гостей (лидерборд)
  x2Until:0, lastGift:0, lastDaily:"",       // таймеры rewarded / ежедневки
  lang:null, hintShown:false,
  time:Date.now()
};}
let S = fresh();

// ---------- Экономика ----------
const x2On      = () => Date.now() < S.x2Until;
const tapGain   = () => 1 + S.tea;
const hearthMult= () => 1 + 0.25*S.hearth;
const ipsBase   = () => S.guests.reduce((a,id)=>a + GU(id).ips, 0);
const ips       = () => Math.floor(ipsBase() * hearthMult() * (x2On()?2:1));
const priceMult = () => Math.max(0.5, 1 - 0.05*S.blanket);
const guestCost = sp => Math.max(1, Math.floor(sp.cost * priceMult()));
const nextGuest = () => GUESTS.find(s=> !S.guests.includes(s.id));
const teaCost    = () => Math.floor(20 * Math.pow(1.6, S.tea));
const hearthCost = () => Math.floor(60 * Math.pow(1.7, S.hearth));
const blanketCost= () => Math.floor(100 * Math.pow(1.9, S.blanket));
// для базового тест-хука: lvl = число гостей, upCost = цена следующего гостя
const upCost   = () => { const n=nextGuest(); return n? guestCost(n) : 0; };

// ---------- Сейвы (throttle + облако, фолбэк localStorage) ----------
function persist(force){
  const now=Date.now();
  if(!force && now-saveT<10000) return;
  saveT=now;
  const raw=JSON.stringify(S);
  try{ localStorage.setItem(SAVE_KEY,raw); }catch(e){}
  if(player){ try{ player.setData({save:raw}); }catch(e){} }
}
function restore(raw){
  if(!raw) return;
  try{ const d=(typeof raw==="string")?JSON.parse(raw):(raw.save?JSON.parse(raw.save):raw);
       if(d&&typeof d==="object") S=Object.assign(fresh(),d); }catch(e){}
  if(!Array.isArray(S.guests)||!S.guests.length) S.guests=['fox'];
  if(!Array.isArray(S.seen)) S.seen=S.guests.slice();
  S.guests.forEach(id=>{ if(!S.seen.includes(id)) S.seen.push(id); });
}

// ---------- Реклама (no-op вне платформы; награда всегда выдаётся) ----------
let lastAd=0;
function maybeInterstitial(){
  if(!ysdk) return;
  if(Date.now()-lastAd < 180000) return;
  lastAd=Date.now();
  try{ ysdk.adv.showFullscreenAdv({}); }catch(e){}
}
function showRewarded(onReward){
  if(!ysdk){ onReward(); return; }
  try{ ysdk.adv.showRewardedVideo({callbacks:{ onRewarded:onReward, onError:onReward, onClose:()=>{} }}); }
  catch(e){ onReward(); }
}

// ---------- Лидерборд ----------
function submitScore(v){ try{ if(lb&&LB_NAME) lb.setLeaderboardScore(LB_NAME, Math.floor(v)); }catch(e){} }

// ---------- HUD ----------
const $ = id => document.getElementById(id);
const fmt = n => n>=1e6 ? (n/1e6).toFixed(2)+"M" : n>=1e4 ? (n/1e3).toFixed(1)+"K" : Math.floor(n).toString();
function refreshHud(){
  $("coinsV").textContent = fmt(S.coins);
  $("ipsV").textContent   = fmt(ips())+"/"+(lang()==="ru"?"с":"s");
  $("coinsL").textContent = T("coins");
  $("ipsL").textContent   = T("income");
  $("giftT").textContent  = T("gift");
  $("giftS").textContent  = "+"+fmt(giftAmt());
  const on=x2On();
  $("x2T").textContent    = on? T("x2on") : T("x2");
  $("x2S").textContent    = on? Math.ceil((S.x2Until-Date.now())/60000)+(lang()==="ru"?" мин":" min") : (lang()==="ru"?"5 мин":"5 min");
  $("x2Btn").classList.toggle("off", on);
  $("langTxt").textContent = lang()==="ru" ? "RU" : "EN";
  document.documentElement.setAttribute("lang", lang());
  if(modalOpen) buildModal(modalOpen); // живое обновление цен в открытой панели
}
let toastT;
function toast(msg){ const el=$("toast"); el.textContent=msg; el.classList.add("on");
  clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("on"),1600); }

// ---------- Награды ----------
const giftAmt = () => Math.max(50, Math.floor(ips()*45));

// ---------- Действия ----------
function doPour(x){
  S.coins += tapGain();
  spawnPour(x);
  refreshHud(); persist(); sfx("tap");
}
function buyGuest(id){
  const sp=GU(id); if(!sp || S.guests.includes(id)) return false;
  const c=guestCost(sp);
  if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S.guests.push(id);
  if(!S.seen.includes(id)) S.seen.push(id);
  S.best=Math.max(S.best,S.guests.length);
  seatGuest(sp); refreshHud(); persist(true); submitScore(S.best); maybeInterstitial(); sfx("buy");
  toast(T("newGuest")+" "+nm(sp)); return true;
}
function buyUp(key){
  const map={tea:teaCost,hearth:hearthCost,blanket:blanketCost};
  const c=map[key](); if(S.coins<c){ toast(T("need")); sfx("error"); return false; }
  S.coins-=c; S[key]++; refreshHud(); persist(true); sfx("buy"); return true;
}
function claimGift(){
  showRewarded(()=>{ const g=giftAmt(); S.coins+=g; refreshHud(); persist(true); sfx("coin");
    toast(T("giftGot")+" +"+fmt(g)); });
}
function claimX2(){
  if(x2On()){ toast(T("x2on")); return; }
  showRewarded(()=>{ S.x2Until=Date.now()+300000; refreshHud(); persist(true); sfx("buy");
    toast(T("x2got")); });
}
function checkDaily(){
  const today=new Date().toISOString().slice(0,10);
  if(S.lastDaily!==today){
    S.lastDaily=today; const g=Math.max(60, Math.floor(ips()*60));
    S.coins+=g; persist(true);
    setTimeout(()=>toast(T("daily")+" +"+fmt(g)), 700);
  }
}

// ---------- Canvas ----------
const cv=$("cv"), ctx=cv.getContext("2d");
let W=0,H=0,DPR=1, floorY=0;
const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
let INK="#4A3324", PAPER="#FFF6E4";
let bgCan=null;

// ── обязательные цветовые хелперы (RUNBOOK «Модельки: стандарт качества») ──
function hexRgb(h){ h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join('');
  const n=parseInt(h,16); return [n>>16&255, n>>8&255, n&255]; }
function shade(hex, amt){
  const [r,g,b]=hexRgb(hex);
  const f=v=>Math.max(0,Math.min(255,Math.round(amt>=0 ? v+(255-v)*amt : v*(1+amt))));
  return 'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
function rgba(hex, a){ const [r,g,b]=hexRgb(hex); return 'rgba('+r+','+g+','+b+','+a+')'; }
function bodyFill(g,cx,cy,rx,ry,base){
  const grad=g.createRadialGradient(cx-rx*0.35,cy-ry*0.5,rx*0.15,cx,cy,Math.max(rx,ry)*1.2);
  grad.addColorStop(0,shade(base,.4)); grad.addColorStop(.55,base); grad.addColorStop(1,shade(base,-.25));
  return grad;
}
function glossSpot(g,cx,cy,r){
  const grad=g.createRadialGradient(cx,cy,0,cx,cy,r);
  grad.addColorStop(0,'rgba(255,255,255,.6)'); grad.addColorStop(1,'rgba(255,255,255,0)');
  return grad;
}
function rimShade(g,cx,cy,rx,ry){
  g.save(); g.beginPath(); g.ellipse(cx,cy,rx,ry,0,0,6.28); g.clip();
  const grad=g.createLinearGradient(cx,cy+ry*0.15,cx,cy+ry);
  grad.addColorStop(0,'rgba(20,10,5,0)'); grad.addColorStop(1,'rgba(20,10,5,.30)');
  g.fillStyle=grad; g.fillRect(cx-rx,cy-ry,rx*2,ry*2);
  g.restore();
}

let winY=0, winR=0, shelfY=0, garlandY=0, charScale=1;
function resize(){
  DPR=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight;
  cv.width=W*DPR; cv.height=H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
  floorY=H*0.46;
  winY=H*0.20; winR=Math.min(W*0.22,H*0.13);
  garlandY=Math.max(20, winY-winR-26);
  shelfY=Math.min(floorY-36, winY+winR+58);
  charScale=Math.max(1, Math.min(2.2, W/460));
  INK=cssVar("--ink")||INK; PAPER=cssVar("--paper")||PAPER;
  buildScenery(); buildBg();
}
addEventListener("resize",resize);

// ---------- Живой мир: гирлянда, светлячок, лист, полки ----------
let garlandBulbs=[], firefly=null, leaf=null, shelves=[], seatSlots=[];
function rr(a,b){ return a+(b-a)*Math.random(); }
function buildScenery(){
  garlandBulbs=[]; const n=Math.max(6, Math.round(W/60));
  for(let i=0;i<n;i++) garlandBulbs.push({ t:i/(n-1), hue: i%2? '#E8B84B':'#D98C3D' });
  firefly={ x:rr(0,W), y:rr(H*0.10,H*0.28), ph:rr(0,6.28), sp:rr(7,13) };
  leaf={ x:-30, y:rr(H*0.08,H*0.2), delay:rr(0,8), life:0, sp:rr(16,24) };
  shelves=[]; const sn=Math.max(2,Math.round(W/340));
  for(let i=0;i<sn;i++) shelves.push({ x: (i+0.5)*W/sn, w:rr(64,92) });
  // 9 фиксированных мест за столиками (пропорционально W/H, с лёгким разбросом)
  const cols=[0.16,0.5,0.84], rows=[0.54,0.69,0.85];
  seatSlots=[];
  let k=0;
  for(let r=0;r<3;r++) for(let c=0;c<3;c++){
    seatSlots.push({ x:W*cols[c]+rr(-10,10), y:H*rows[r]+rr(-6,6), s:(0.86+r*0.09)*charScale, jx:rr(0,6.28), jy:rr(0,6.28) });
    k++;
  }
}
function buildBg(){
  bgCan=document.createElement('canvas'); bgCan.width=Math.max(1,W*DPR); bgCan.height=Math.max(1,H*DPR);
  const g=bgCan.getContext('2d'); g.setTransform(DPR,0,0,DPR,0,0);
  // общий фон комнаты — тёплое дерево, темнее книзу
  const rg=g.createLinearGradient(0,0,0,H);
  rg.addColorStop(0,'#5C4530'); rg.addColorStop(0.5,'#4A3524'); rg.addColorStop(1,'#2E2015');
  g.fillStyle=rg; g.fillRect(0,0,W,H);
  // круглое окно с сумеречным лесом
  const wx=W*0.5, wy=winY, wr=winR;
  g.save(); g.beginPath(); g.arc(wx,wy,wr,0,6.28); g.clip();
  const sky=g.createLinearGradient(0,wy-wr,0,wy+wr);
  sky.addColorStop(0,'#6E5A9C'); sky.addColorStop(0.5,'#B9744C'); sky.addColorStop(1,'#E8A662');
  g.fillStyle=sky; g.fillRect(wx-wr,wy-wr,wr*2,wr*2);
  // луна
  g.fillStyle='rgba(255,247,220,.85)'; g.beginPath(); g.arc(wx+wr*0.4,wy-wr*0.35,wr*0.16,0,6.28); g.fill();
  // звёзды
  for(let i=0;i<10;i++){ g.fillStyle='rgba(255,255,255,'+rr(0.3,0.8).toFixed(2)+')';
    g.beginPath(); g.arc(wx+rr(-wr,wr)*0.9, wy+rr(-wr,-wr*0.2), rr(0.6,1.4), 0, 6.28); g.fill(); }
  // дальние ели силуэтом
  g.fillStyle='#241A28';
  for(let i=0;i<6;i++){ const tx=wx-wr+ (i+0.5)*(wr*2/6), th=rr(wr*0.35,wr*0.6), tw=rr(wr*0.16,wr*0.24);
    g.beginPath(); g.moveTo(tx,wy+wr); g.lineTo(tx-tw/2,wy+wr-th*0.55); g.lineTo(tx,wy+wr-th); g.lineTo(tx+tw/2,wy+wr-th*0.55); g.closePath(); g.fill(); }
  g.restore();
  g.lineWidth=Math.max(6,wr*0.12); g.strokeStyle='#2E2015'; g.beginPath(); g.arc(wx,wy,wr,0,6.28); g.stroke();
  g.lineWidth=3; g.strokeStyle='rgba(255,255,255,.12)'; g.beginPath(); g.arc(wx,wy,wr-Math.max(6,wr*0.12)/2,0,6.28); g.stroke();
  // полки с баночками чая — чётко под окном, с тенью для контраста
  shelves.forEach(sh=>{
    const sy=shelfY;
    g.fillStyle='rgba(10,6,3,.30)'; g.beginPath();
    g.ellipse(sh.x, sy+9, sh.w*0.56, 5, 0, 0, 6.28); g.fill();
    g.fillStyle='#7A5A3A'; g.strokeStyle=INK; g.lineWidth=2.5;
    g.beginPath(); g.roundRect ? g.roundRect(sh.x-sh.w/2,sy,sh.w,8,3) : g.rect(sh.x-sh.w/2,sy,sh.w,8);
    g.fill(); g.stroke();
    // 2 крупные баночки на полке
    [0.28,0.72].forEach((f,i)=>{
      const jx=sh.x-sh.w/2+sh.w*f, jh=sh.w*0.30, jw=sh.w*0.22;
      g.fillStyle= i===0? '#B9744C' : '#8FBF7A'; g.strokeStyle=INK; g.lineWidth=2.4;
      g.beginPath(); g.roundRect ? g.roundRect(jx-jw/2, sy-jh, jw, jh, 4) : g.rect(jx-jw/2, sy-jh, jw, jh);
      g.fill(); g.stroke();
      g.fillStyle='rgba(255,255,255,.22)'; g.beginPath();
      g.roundRect ? g.roundRect(jx-jw*0.32, sy-jh+3, jw*0.22, jh*0.7, 2) : g.rect(jx-jw*0.32, sy-jh+3, jw*0.22, jh*0.7);
      g.fill();
      g.fillStyle=INK; g.beginPath();
      g.roundRect ? g.roundRect(jx-jw*0.42, sy-jh-4, jw*0.84, 5, 2) : g.rect(jx-jw*0.42, sy-jh-4, jw*0.84, 5);
      g.fill();
    });
  });
  // пол — доски с мягким виньетным затемнением по краям
  const fg=g.createLinearGradient(0,floorY,0,H);
  fg.addColorStop(0,'#6B4E33'); fg.addColorStop(1,'#3C2A1B');
  g.fillStyle=fg; g.fillRect(0,floorY,W,H-floorY);
  g.strokeStyle='rgba(30,18,10,.35)'; g.lineWidth=2;
  for(let x=0;x<W;x+=34){ g.beginPath(); g.moveTo(x,floorY); g.lineTo(x,H); g.stroke(); }
  // круглый уютный коврик — с кольцевым узором, не плоское пятно
  const rugR=Math.min(W*0.22,150);
  g.save(); g.translate(W/2,H*0.72); g.scale(1,0.42);
  const rug=g.createRadialGradient(0,0,4,0,0,rugR);
  rug.addColorStop(0,'#C96B4A'); rug.addColorStop(1,'#9C5638');
  g.fillStyle=rug; g.beginPath(); g.arc(0,0,rugR,0,6.28); g.fill();
  g.strokeStyle=INK; g.lineWidth=3; g.stroke();
  g.strokeStyle='rgba(255,246,228,.35)'; g.lineWidth=Math.max(2,rugR*0.05);
  g.beginPath(); g.arc(0,0,rugR*0.68,0,6.28); g.stroke();
  g.strokeStyle='rgba(74,51,36,.25)'; g.lineWidth=Math.max(1.5,rugR*0.03);
  g.beginPath(); g.arc(0,0,rugR*0.38,0,6.28); g.stroke();
  g.restore();
  // мягкая виньетка
  const vg=g.createRadialGradient(W/2,H*0.55,Math.min(W,H)*0.25,W/2,H*0.55,Math.max(W,H)*0.72);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(10,6,3,.38)');
  g.fillStyle=vg; g.fillRect(0,0,W,H);
}
function drawBackground(){ if(bgCan) ctx.drawImage(bgCan,0,0,W,H); }

// гирлянда над полками (провисает и покачивается)
function drawGarland(t){
  const y0=garlandY, sag=14+Math.sin(t*0.7)*3;
  ctx.strokeStyle='#3C2A1B'; ctx.lineWidth=2.5; ctx.beginPath();
  ctx.moveTo(W*0.06,y0);
  ctx.quadraticCurveTo(W*0.5, y0+sag, W*0.94, y0);
  ctx.stroke();
  garlandBulbs.forEach(b=>{
    const x=W*0.06 + (W*0.88)*b.t;
    const bez = (1-b.t)*(1-b.t)*y0 + 2*(1-b.t)*b.t*(y0+sag) + b.t*b.t*y0;
    const glow=0.55+0.35*Math.sin(t*2.2+b.t*10);
    const gr=ctx.createRadialGradient(x,bez+5,0,x,bez+5,9);
    gr.addColorStop(0, rgba(b.hue,glow)); gr.addColorStop(1, rgba(b.hue,0));
    ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(x,bez+5,9,0,6.28); ctx.fill();
    ctx.fillStyle=b.hue; ctx.beginPath(); ctx.arc(x,bez+5,3,0,6.28); ctx.fill();
  });
}
function drawFirefly(t,dt){
  const f=firefly; f.ph+=dt*f.sp*0.1;
  f.x=W*0.5+Math.sin(f.ph)*W*0.36; f.y=H*0.18+Math.cos(f.ph*1.4)*H*0.05;
  const a=0.4+0.4*Math.sin(t*4+f.ph);
  const gr=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,7);
  gr.addColorStop(0,'rgba(232,184,75,'+a.toFixed(2)+')'); gr.addColorStop(1,'rgba(232,184,75,0)');
  ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(f.x,f.y,7,0,6.28); ctx.fill();
  ctx.fillStyle='rgba(255,240,200,'+(a*0.9).toFixed(2)+')'; ctx.beginPath(); ctx.arc(f.x,f.y,1.6,0,6.28); ctx.fill();
}
function drawLeaf(t,dt){
  const l=leaf; l.life+=dt;
  if(l.life>l.delay){
    l.x+=l.sp*dt; l.y+=Math.sin(l.life*2)*10*dt;
    if(l.x>W+30){ l.x=-30; l.y=rr(H*0.08,H*0.2); l.delay=l.life+rr(4,10); l.sp=rr(16,24); }
    ctx.save(); ctx.translate(l.x,l.y); ctx.rotate(Math.sin(l.life*1.6));
    ctx.fillStyle='#B9744C'; ctx.strokeStyle=INK; ctx.lineWidth=1.4;
    ctx.beginPath(); ctx.moveTo(0,-5); ctx.quadraticCurveTo(6,0,0,5); ctx.quadraticCurveTo(-6,0,0,-5); ctx.closePath();
    ctx.fill(); ctx.stroke(); ctx.restore();
  }
}

// ---------- Чайник на стойке + пар ----------
let steams=[]; // общие частицы пара (от чайника и чашек гостей)
function spawnSteam(x,y,n){ for(let i=0;i<(n||1);i++) steams.push({x:x+rr(-4,4),y,life:1,vx:rr(-4,4),vy:rr(-16,-24)}); }
function drawTeapot(t){
  const cx=W*0.5, cy=H*0.80, s=Math.min(W*0.11,42)*charScale;
  // стойка
  ctx.fillStyle='#6B4E33'; ctx.strokeStyle=INK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.roundRect? ctx.roundRect(cx-s*1.7,cy+s*0.55,s*3.4,s*0.55,6) : ctx.rect(cx-s*1.7,cy+s*0.55,s*3.4,s*0.55);
  ctx.fill(); ctx.stroke();
  ctx.save(); ctx.translate(cx,cy);
  const bob=Math.sin(t*1.4)*1.2;
  ctx.translate(0,bob);
  // тело чайника
  ctx.fillStyle=bodyFill(ctx,-s*0.1,-s*0.05,s*0.62,s*0.5,'#C96B4A');
  ctx.strokeStyle=INK; ctx.lineWidth=3;
  ctx.beginPath(); ctx.ellipse(0,0,s*0.62,s*0.5,0,0,6.28); ctx.fill(); ctx.stroke();
  rimShade(ctx,0,0,s*0.62,s*0.5);
  ctx.fillStyle=glossSpot(ctx,-s*0.22,-s*0.22,s*0.28); ctx.beginPath(); ctx.ellipse(-s*0.22,-s*0.22,s*0.28,s*0.2,0,0,6.28); ctx.fill();
  // носик
  ctx.fillStyle='#C96B4A'; ctx.strokeStyle=INK; ctx.lineWidth=2.6;
  ctx.beginPath(); ctx.moveTo(s*0.55,-s*0.08); ctx.quadraticCurveTo(s*0.9,-s*0.28,s*0.98,-s*0.4);
  ctx.quadraticCurveTo(s*0.86,-s*0.16,s*0.5,s*0.08); ctx.closePath(); ctx.fill(); ctx.stroke();
  // ручка
  ctx.strokeStyle=INK; ctx.lineWidth=4; ctx.beginPath();
  ctx.moveTo(-s*0.55,-s*0.2); ctx.quadraticCurveTo(-s*0.98,-s*0.05,-s*0.55,s*0.28); ctx.stroke();
  // крышка
  ctx.fillStyle='#D9825C'; ctx.strokeStyle=INK; ctx.lineWidth=2.4;
  ctx.beginPath(); ctx.ellipse(0,-s*0.45,s*0.22,s*0.1,0,0,6.28); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(0,-s*0.56,s*0.06,0,6.28); ctx.fillStyle='#D9825C'; ctx.fill(); ctx.stroke();
  ctx.restore();
  if(Math.random()<0.06) spawnSteam(cx, cy-s*0.6, 1);
}

// ---------- Гости (векторные модельки, уникальные силуэты) ----------
let seated=[]; // {sp,slot,phase,sip}
function seatGuest(sp){
  const idx=S.guests.indexOf(sp.id);
  const slot=seatSlots[idx] || seatSlots[seatSlots.length-1];
  seated.push({ sp, slot, phase:rr(0,6.28), sip:0 });
}
function rebuildSeated(){ seated=[]; S.guests.forEach(id=>seatGuest(GU(id))); }

// универсальная отрисовка гостя: g — контекст, sp — вид, (cx,cy) центр, scale, dir, sip[0..1]
function drawGuest(g, sp, cx, cy, scale, dir, sip){
  g.save(); g.translate(cx,cy); g.scale((dir||1)*scale, scale);
  const ink=INK; g.lineJoin='round';
  const dims = {
    fox:{bw:20,bh:16,hr:11}, rabbit:{bw:17,bh:16,hr:10.5}, hedgehog:{bw:18,bh:15,hr:10},
    mouse:{bw:12,bh:11,hr:8}, deer:{bw:16,bh:16,hr:10}, raccoon:{bw:18,bh:15,hr:10.5},
    badger:{bw:19,bh:15,hr:11}, owl:{bw:15,bh:19,hr:12}, bear:{bw:22,bh:18,hr:12.5},
  };
  const d=dims[sp.shape]||dims.fox;
  const hy=-d.bh-d.hr*0.55; // центр головы
  const sipR = 1+ (sip||0)*0.06;

  // ── хвост/уши позади тела (species-specific) ──
  if(sp.shape==='fox'){
    g.fillStyle=bodyFill(g,d.bw*0.6,d.bh*0.1,d.bw*0.55,d.bh*0.4,sp.c1); g.strokeStyle=ink; g.lineWidth=2.6;
    g.save(); g.translate(d.bw*0.55,d.bh*0.15); g.rotate(0.35);
    g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(22,-6,20,10); g.quadraticCurveTo(10,14,0,4); g.closePath(); g.fill(); g.stroke();
    g.fillStyle=sp.c2; g.beginPath(); g.ellipse(17,6,5,4,0.4,0,6.28); g.fill(); g.restore();
  } else if(sp.shape==='rabbit'){
    g.fillStyle='#fff'; g.strokeStyle=ink; g.lineWidth=2.2;
    g.beginPath(); g.arc(d.bw*0.55,d.bh*0.25,5.5,0,6.28); g.fill(); g.stroke();
  } else if(sp.shape==='raccoon'){
    g.strokeStyle=ink; g.lineWidth=1.5;
    g.save(); g.translate(d.bw*0.5,d.bh*0.1); g.rotate(0.5);
    g.fillStyle=sp.c1; g.beginPath(); g.moveTo(0,0); g.quadraticCurveTo(20,-4,18,12); g.quadraticCurveTo(8,14,0,4); g.closePath(); g.fill(); g.stroke();
    for(let i=0;i<3;i++){ g.fillStyle=sp.c2; g.beginPath(); g.ellipse(4+i*5,2+i*3,2.6,3.4,0.6,0,6.28); g.fill(); }
    g.restore();
  } else if(sp.shape==='bear'){
    g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=2.2;
    g.beginPath(); g.arc(d.bw*0.65,d.bh*0.35,4.5,0,6.28); g.fill(); g.stroke();
  } else if(sp.shape==='mouse'){
    g.strokeStyle=ink; g.lineWidth=2; g.lineCap='round'; g.beginPath();
    g.moveTo(d.bw*0.5,d.bh*0.2); g.quadraticCurveTo(d.bw*1.1,d.bh*0.1,d.bw*1.3,d.bh*0.5); g.stroke();
  }

  // ── тело ──
  g.fillStyle=bodyFill(g,-d.bw*0.15,-d.bh*0.35,d.bw*sipR,d.bh*sipR,sp.c1);
  g.strokeStyle=ink; g.lineWidth=3;
  g.beginPath(); g.ellipse(0,0,d.bw*sipR,d.bh*sipR,0,0,6.28); g.fill(); g.stroke();
  rimShade(g,0,0,d.bw*sipR,d.bh*sipR);
  // светлое брюшко/грудка
  g.save(); g.beginPath(); g.ellipse(0,0,d.bw,d.bh,0,0,6.28); g.clip();
  g.fillStyle=rgba('#ffffff',.28); g.beginPath(); g.ellipse(1,d.bh*0.4,d.bw*0.78,d.bh*0.5,0,0,6.28); g.fill();
  // species markings
  if(sp.shape==='hedgehog'){
    g.strokeStyle=shade(sp.c1,-.3); g.lineWidth=2.2; g.lineCap='round';
    for(let row=0;row<3;row++) for(let i=-3;i<=3;i++){
      const px=i*3.6, py=-d.bh*0.7+row*6;
      g.beginPath(); g.moveTo(px,py); g.lineTo(px+2.2,py-6); g.stroke();
    }
  }
  if(sp.shape==='deer'){
    g.fillStyle=rgba(sp.c2,.9);
    [[-6,-2],[5,2],[-2,7],[8,-6]].forEach(p=>{ g.beginPath(); g.ellipse(p[0],p[1],2.4,2.4,0,0,6.28); g.fill(); });
  }
  if(sp.shape==='badger'){
    g.fillStyle=sp.c2; g.beginPath(); g.ellipse(0,-d.bh*0.55,d.bw*0.22,d.bh*0.75,0,0,6.28); g.fill();
  }
  g.restore();
  // ── голова ──
  g.save(); g.translate(0,hy);
  // уши/рога/крылья позади головы
  if(sp.shape==='fox'){
    [[-1,-1],[1,-1]].forEach(m=>{
      g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=2.4;
      g.beginPath(); g.moveTo(m[0]*d.hr*0.55,-d.hr*0.3); g.lineTo(m[0]*d.hr*1.1,-d.hr*1.7); g.lineTo(m[0]*d.hr*0.05,-d.hr*0.9); g.closePath();
      g.fill(); g.stroke();
      g.fillStyle=sp.c2; g.beginPath(); g.moveTo(m[0]*d.hr*0.42,-d.hr*0.45); g.lineTo(m[0]*d.hr*0.85,-d.hr*1.35); g.lineTo(m[0]*d.hr*0.18,-d.hr*0.85); g.closePath(); g.fill();
    });
  } else if(sp.shape==='rabbit'){
    [[-1,0],[1,0]].forEach(m=>{
      g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=2.4;
      g.beginPath(); g.ellipse(m[0]*d.hr*0.5,-d.hr*1.5,d.hr*0.32,d.hr*1.15,m[0]*0.12,0,6.28); g.fill(); g.stroke();
      g.fillStyle=sp.c2; g.beginPath(); g.ellipse(m[0]*d.hr*0.5,-d.hr*1.45,d.hr*0.16,d.hr*0.8,m[0]*0.12,0,6.28); g.fill();
    });
  } else if(sp.shape==='hedgehog'){
    [[-1,0],[1,0]].forEach(m=>{ g.fillStyle=sp.c2; g.strokeStyle=ink; g.lineWidth=2;
      g.beginPath(); g.arc(m[0]*d.hr*0.85,-d.hr*0.65,d.hr*0.28,0,6.28); g.fill(); g.stroke(); });
  } else if(sp.shape==='mouse'){
    [[-1,0],[1,0]].forEach(m=>{ g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=2.2;
      g.beginPath(); g.arc(m[0]*d.hr*0.85,-d.hr*0.75,d.hr*0.48,0,6.28); g.fill(); g.stroke();
      g.fillStyle=sp.c2; g.beginPath(); g.arc(m[0]*d.hr*0.85,-d.hr*0.75,d.hr*0.24,0,6.28); g.fill(); });
  } else if(sp.shape==='deer'){
    g.strokeStyle=shade(sp.c1,-.35); g.lineWidth=2.4; g.lineCap='round';
    [[-1,0],[1,0]].forEach(m=>{ g.beginPath(); g.moveTo(m[0]*d.hr*0.4,-d.hr*1.1);
      g.lineTo(m[0]*d.hr*0.75,-d.hr*1.9); g.moveTo(m[0]*d.hr*0.55,-d.hr*1.55); g.lineTo(m[0]*d.hr*0.95,-d.hr*1.7); g.stroke(); });
    [[-1,0],[1,0]].forEach(m=>{ g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=2.2;
      g.beginPath(); g.ellipse(m[0]*d.hr*0.7,-d.hr*0.6,d.hr*0.22,d.hr*0.55,m[0]*0.3,0,6.28); g.fill(); g.stroke(); });
  } else if(sp.shape==='raccoon' || sp.shape==='badger' || sp.shape==='bear'){
    [[-1,0],[1,0]].forEach(m=>{ g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=2.4;
      g.beginPath(); g.arc(m[0]*d.hr*0.8,-d.hr*0.7,d.hr*0.32,0,6.28); g.fill(); g.stroke(); });
  } else if(sp.shape==='owl'){
    [[-1,0],[1,0]].forEach(m=>{ g.fillStyle=sp.c1; g.strokeStyle=ink; g.lineWidth=2.2;
      g.beginPath(); g.moveTo(m[0]*d.hr*0.55,-d.hr*0.9); g.lineTo(m[0]*d.hr*0.85,-d.hr*1.55); g.lineTo(m[0]*d.hr*0.2,-d.hr*1.05); g.closePath(); g.fill(); g.stroke(); });
  }
  // голова
  g.fillStyle=bodyFill(g,-d.hr*0.3,-d.hr*0.35,d.hr,d.hr,sp.c1);
  g.strokeStyle=ink; g.lineWidth=3;
  g.beginPath(); g.arc(0,0,d.hr,0,6.28); g.fill(); g.stroke();
  rimShade(g,0,0,d.hr,d.hr);
  // маска/полосы на морде
  if(sp.shape==='raccoon'){
    g.fillStyle=rgba(sp.c2,.92); g.beginPath();
    g.ellipse(-d.hr*0.42,0,d.hr*0.34,d.hr*0.26,-0.2,0,6.28); g.fill();
    g.beginPath(); g.ellipse(d.hr*0.42,0,d.hr*0.34,d.hr*0.26,0.2,0,6.28); g.fill();
  }
  if(sp.shape==='badger'){
    g.fillStyle=sp.c2; g.beginPath(); g.moveTo(-d.hr*0.22,-d.hr*0.9); g.lineTo(d.hr*0.22,-d.hr*0.9);
    g.lineTo(d.hr*0.14,d.hr*0.85); g.lineTo(-d.hr*0.14,d.hr*0.85); g.closePath(); g.fill();
  }
  if(sp.shape==='bear' || sp.shape==='hedgehog'){
    g.fillStyle=rgba(sp.c2,.85); g.beginPath(); g.ellipse(0,d.hr*0.32,d.hr*0.5,d.hr*0.36,0,0,6.28); g.fill();
  }
  // блик на голове
  g.fillStyle=glossSpot(g,-d.hr*0.35,-d.hr*0.4,d.hr*0.45);
  g.beginPath(); g.ellipse(-d.hr*0.35,-d.hr*0.4,d.hr*0.45,d.hr*0.32,0,0,6.28); g.fill();
  // глаза
  const ew = sp.shape==='owl'? d.hr*0.85 : d.hr*0.62;
  const eR = sp.shape==='owl'? d.hr*0.42 : d.hr*0.24;
  [-1,1].forEach(side=>{
    const ex=side*ew*0.5, ey= sp.shape==='owl'? -d.hr*0.05 : -d.hr*0.05;
    g.fillStyle='#fff'; g.strokeStyle=ink; g.lineWidth=1.8;
    g.beginPath(); g.arc(ex,ey,eR,0,6.28); g.fill(); g.stroke();
    const irisHue = sp.shape==='owl'? '#E8B84B' : (sp.shape==='fox'?'#7A4A2A':'#3A2A1E');
    g.fillStyle=irisHue; g.beginPath(); g.arc(ex+side*eR*0.15,ey,eR*0.62,0,6.28); g.fill();
    g.fillStyle=ink; g.beginPath(); g.arc(ex+side*eR*0.15,ey,eR*0.3,0,6.28); g.fill();
    g.fillStyle='#fff'; g.beginPath(); g.arc(ex+side*eR*0.15-eR*0.2,ey-eR*0.22,eR*0.16,0,6.28); g.fill();
    g.beginPath(); g.arc(ex+side*eR*0.15+eR*0.18,ey+eR*0.15,eR*0.1,0,6.28); g.fill();
  });
  // румянец
  g.fillStyle=rgba('#E8708A',.4);
  g.beginPath(); g.ellipse(-d.hr*0.72,d.hr*0.28,d.hr*0.24,d.hr*0.15,0,0,6.28); g.fill();
  g.beginPath(); g.ellipse(d.hr*0.72,d.hr*0.28,d.hr*0.24,d.hr*0.15,0,0,6.28); g.fill();
  // нос+рот
  const muzzleLen = sp.shape==='fox'||sp.shape==='mouse'||sp.shape==='raccoon'? d.hr*0.35 : d.hr*0.12;
  g.fillStyle=ink; g.beginPath(); g.ellipse(0,d.hr*0.45+muzzleLen*0.3,d.hr*0.14,d.hr*0.1,0,0,6.28); g.fill();
  g.strokeStyle=ink; g.lineWidth=1.8; g.beginPath();
  g.moveTo(0,d.hr*0.55+muzzleLen*0.3); g.quadraticCurveTo(d.hr*0.15,d.hr*0.72,d.hr*0.28,d.hr*0.62); g.stroke();
  g.beginPath(); g.moveTo(0,d.hr*0.55+muzzleLen*0.3); g.quadraticCurveTo(-d.hr*0.15,d.hr*0.72,-d.hr*0.28,d.hr*0.62); g.stroke();
  g.restore(); // конец головы

  // передние лапки на коленях
  g.fillStyle=shade(sp.c1,-.05); g.strokeStyle=ink; g.lineWidth=2.2;
  [-1,1].forEach(side=>{ g.beginPath(); g.ellipse(side*d.bw*0.42,d.bh*0.55,d.bw*0.16,d.bh*0.13,0,0,6.28); g.fill(); g.stroke(); });

  g.restore();
}

// ── чашка на мини-столике перед гостем ──
function drawTeaTable(g,cx,cy,s,sipPhase){
  g.save(); g.translate(cx,cy);
  g.fillStyle='#6B4E33'; g.strokeStyle=INK; g.lineWidth=2;
  g.beginPath(); g.ellipse(0,4*s,10*s,3.4*s,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle='#7C5A3C'; g.fillRect(-1.6*s,4*s,3.2*s,7*s);
  // чашка чуть покачивается когда гость отпивает
  const tilt=Math.sin(sipPhase)*0.12;
  g.save(); g.translate(0,1*s); g.rotate(tilt);
  g.fillStyle='#FFF6E4'; g.strokeStyle=INK; g.lineWidth=1.6;
  g.beginPath(); g.ellipse(0,0,4.4*s,2.6*s,0,0,6.28); g.fill(); g.stroke();
  g.fillStyle='#B9744C'; g.beginPath(); g.ellipse(0,-0.4*s,3.2*s,1.6*s,0,0,6.28); g.fill();
  g.restore();
  g.restore();
}

function updateSeated(t,dt){
  seated.forEach(sO=>{
    sO.phase+=dt*0.9;
    sO.sip=Math.max(0,Math.sin(sO.phase*0.5))*Math.max(0,Math.sin(t*0.6+sO.slot.jx));
    if(Math.random()<0.01) spawnSteam(sO.slot.x, sO.slot.y-sO.slot.s*14, 1);
  });
}
function drawSeated(t){
  seated.forEach(sO=>{
    const wob=Math.sin(t*1.1+sO.slot.jy)*2;
    drawTeaTable(ctx, sO.slot.x + sO.slot.s*20, sO.slot.y+6, sO.slot.s*1.1, sO.phase*2);
    drawGuest(ctx, sO.sp, sO.slot.x, sO.slot.y+wob, sO.slot.s, -1, sO.sip);
    const label=nm(sO.sp);
    ctx.font='800 12px Nunito, sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
    const wpx=ctx.measureText(label).width+16, ny=sO.slot.y-sO.slot.s*34;
    ctx.fillStyle=PAPER; ctx.strokeStyle=INK; ctx.lineWidth=2;
    roundRect(ctx, sO.slot.x-wpx/2, ny-10, wpx, 20, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle=INK; ctx.fillText(label, sO.slot.x, ny);
  });
}
function roundRect(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

// ---------- Разлитый чай (тап на счётчике) + искры + пар ----------
let pours=[], sparks=[];
function spawnPour(x){
  const px=(x==null)? W*0.5 : x, py=H*0.86;
  pours.push({x:px,y:py,life:1});
  spawnSteam(px,py-8,3);
  for(let i=0;i<5;i++) sparks.push({x:px+rr(-10,10),y:py-rr(0,10),life:1,txt:false});
  sparks.push({x:px,y:py-14,life:1.3,txt:true,val:"+"+fmt(tapGain())});
}
function updateFx(dt){
  for(let i=steams.length-1;i>=0;i--){ const s=steams[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt*0.7; if(s.life<=0) steams.splice(i,1); }
  for(let i=pours.length-1;i>=0;i--){ const p=pours[i]; p.life-=dt*1.6; if(p.life<=0) pours.splice(i,1); }
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.y-=22*dt; s.life-=dt*(s.txt?0.9:1.6); if(s.life<=0) sparks.splice(i,1); }
}
function drawFx(){
  steams.forEach(s=>{ ctx.globalAlpha=Math.max(0,s.life)*0.5; ctx.fillStyle='#FFF6E4';
    ctx.beginPath(); ctx.arc(s.x,s.y,3+2*(1-s.life),0,6.28); ctx.fill(); ctx.globalAlpha=1; });
  pours.forEach(p=>{ ctx.globalAlpha=Math.max(0,p.life)*0.7; ctx.strokeStyle='#B9744C'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(p.x,p.y,(1-p.life)*22,0,6.28); ctx.stroke(); ctx.globalAlpha=1; });
  sparks.forEach(s=>{
    ctx.globalAlpha=Math.max(0,s.life);
    if(s.txt){ ctx.font='900 15px Nunito, sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#E8B84B';
      ctx.strokeStyle=INK; ctx.lineWidth=3; ctx.strokeText(s.val,s.x,s.y); ctx.fillText(s.val,s.x,s.y); }
    else { ctx.fillStyle='#E8B84B'; ctx.beginPath(); ctx.arc(s.x,s.y,2.2,0,6.28); ctx.fill(); }
    ctx.globalAlpha=1;
  });
}

// ---------- Главный цикл ----------
let lastT=performance.now(), acc=0, tSec=0;
function frame(now){
  let dt=Math.max(0,Math.min(0.05,(now-lastT)/1000)); lastT=now; tSec+=dt;
  acc+=dt;
  if(acc>=1){ const t=Math.floor(acc); acc-=t; if(ips()>0){ S.coins+=ips()*t; refreshHud(); persist(); } }
  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawGarland(tSec);
  drawFirefly(tSec,dt);
  drawLeaf(tSec,dt);
  updateSeated(tSec,dt);
  drawSeated(tSec);
  drawTeapot(tSec);
  updateFx(dt);
  drawFx();
  requestAnimationFrame(frame);
}

// ---------- Тест-хуки ----------
window.render_game_to_text = () => JSON.stringify({
  coins:Math.floor(S.coins), lvl:S.guests.length, ips:ips(), upCost:upCost(),
  guests:S.guests.length, seen:S.seen.length, tea:S.tea, hearth:S.hearth, blanket:S.blanket,
  tapGain:tapGain(), best:S.best, x2:x2On(), lang:lang()
});
window.advanceTime = ms => { S.coins += ips()*(ms/1000); refreshHud(); };
window.__grant = n => { S.coins+=n; refreshHud(); };
window.__buyNextGuest = () => { const n=nextGuest(); return n? buyGuest(n.id) : false; };
window.__buyUp = k => buyUp(k);
window.__pour = () => doPour();
window.__toggleLang = () => toggleLang();

// ---------- Boot ----------
function boot(raw){
  if(booted) return; booted=true;
  restore(raw);
  document.documentElement.setAttribute("lang", lang());
  resize(); rebuildSeated(); refreshHud();
  $("giftBtn").onclick  = claimGift;
  $("x2Btn").onclick    = claimX2;
  $("guestBtn").onclick = ()=>openModal('guest');
  $("upBtn").onclick    = ()=>openModal('up');
  $("collBtn").onclick  = ()=>openModal('coll');
  $("langBtn").onclick  = toggleLang;
  $("mClose").onclick   = closeModal;
  $("modal").addEventListener('pointerdown', e=>{ if(e.target.id==='modal') closeModal(); });
  // тап по чайной = налить чай в точке касания
  cv.addEventListener('pointerdown', e=>{ if(modalOpen) return; doPour(e.clientX); });
  if(!S.hintShown && S.coins<60 && S.guests.length===1){
    setTimeout(()=>{ if(!modalOpen){ toast(T("hintPour")); S.hintShown=true; persist(true); } }, 2500);
  }
  checkDaily();
  startMusic();
  setInterval(()=>refreshHud(), 1000); // обновляет таймер ×2 и цены
  requestAnimationFrame(frame);
}
(function initSDK(){
  let localRaw=null; try{ localRaw=localStorage.getItem(SAVE_KEY); }catch(e){}
  function start(){
    if(window.YaGames && !window.__noSDK){
      YaGames.init().then(sdk=>{
        ysdk=sdk;
        try{ sdk.features.LoadingAPI && sdk.features.LoadingAPI.ready(); }catch(e){}
        const pReady = sdk.getPlayer({scopes:false}).then(p=>{player=p;return p.getData(["save"]);})
          .then(d=>boot(d&&d.save?d.save:localRaw)).catch(()=>boot(localRaw));
        try{ lb = sdk.leaderboards; }catch(e){}
        return pReady;
      }).catch(()=>boot(localRaw));
      setTimeout(()=>boot(localRaw),4000);
    } else boot(localRaw);
  }
  if(window.__noSDK || window.YaGames) start();
  else window.__onSdkScriptDone = start;
})();
